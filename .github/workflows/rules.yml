name: Mandatory Rules

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    name: mandatory-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run rule checks (script taken from the base branch)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git show "$BASE_SHA:.github/scripts/check-rules.mjs" > "$RUNNER_TEMP/check-rules.mjs"
          node "$RUNNER_TEMP/check-rules.mjs"
